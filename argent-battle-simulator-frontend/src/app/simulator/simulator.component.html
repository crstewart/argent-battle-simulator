<div class="border">
    <p>
        Take it for a test drive here! Choose two fighters to duke it out and see the result of the match below!
    </p>
    <simulator-form #simulatorForm></simulator-form>
</div>

<div *ngIf="simulation != null" class="border simulator-result">
    <a *ngIf="simulation.id != null" class="download-link" target="_blank" [href]="getDownloadLink(simulation.id)">
        Download Log
    </a>
    <div class="log">
        <character-image [fighter]="simulation.fighter1"></character-image>
        <div class="vs-frame">
            <img src="assets/images/vs.png" alt="VS" />
        </div>
        <character-image [fighter]="simulation.fighter2"></character-image>
        <p>{{simulation.message}}</p>
    </div>
</div>
